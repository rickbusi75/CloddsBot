name: cloddsbot
services:
  bot:
    image: lab/cloddsbot:rick-20261016.1
    build:
      context: ../..
      dockerfile: Dockerfile.lab
    init: true
    env_file: /srv/lab/config/cloddsbot/bot.env
    environment:
      CLODDS_CONFIG_PATH: /config/clodds.json
      npm_package_version: 1.9.1
    volumes:
      - /srv/lab/data/cloddsbot:/data
      - /srv/lab/data/cloddsbot/transformers-cache:/app/.transformers-cache
      - /srv/lab/config/cloddsbot/clodds.json:/config/clodds.json:ro
      - /srv/lab/config/cloddsbot/bot.env:/app/.env
    ports:
      - '127.0.0.1:18789:18789'
    restart: unless-stopped
    stop_grace_period: 45s
    mem_limit: 3g
    cpus: 1.25
